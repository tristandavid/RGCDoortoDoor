{% extends "base.html" %}
{% block title %}Reset Password | {{ company.name }}{% endblock %}
{% block content %}

<section class="section">
  <div class="container">
    <div class="login-box" style="max-width:460px;">

      <h2 style="margin-top:0;">Set a New Password</h2>
      <p style="color:var(--text-muted);">Choose a new password for your account.</p>

      <form method="post" class="admin-form">
        <div>
          <label for="password">New Password <span style="color:var(--text-muted); font-weight:400;">(min. 8 characters)</span></label>
          <input type="password" id="password" name="password" required autofocus
                 autocomplete="new-password" minlength="8">
        </div>
        <div>
          <label for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required
                 autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:.25rem;">Reset Password</button>
      </form>

      <p style="margin-top:1.1rem; text-align:center; font-size:.88rem; color:var(--text-muted);">
        <a href="{{ url_for('customer_login') }}">&larr; Back to Sign In</a>
      </p>

    </div>
  </div>
</section>

{% endblock %}
