{% extends "base.html" %}
{% block title %}Forgot Password | {{ company.name }}{% endblock %}
{% block content %}

<section class="section">
  <div class="container">
    <div class="login-box" style="max-width:460px;">

      <h2 style="margin-top:0;">Forgot Your Password?</h2>
      <p style="color:var(--text-muted);">
        Enter the email address on your account and we'll send you a link to reset your password.
      </p>

      <form method="post" class="admin-form">
        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autofocus autocomplete="email"
                 value="{{ request.form.get('email', '') }}">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:.25rem;">Send Reset Link</button>
      </form>

      <p style="margin-top:1.1rem; text-align:center; font-size:.88rem; color:var(--text-muted);">
        <a href="{{ url_for('customer_login') }}">&larr; Back to Sign In</a>
      </p>

    </div>
  </div>
</section>

{% endblock %}
