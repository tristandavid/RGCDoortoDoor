{% extends "base.html" %}
{% block title %}Track Your Package | {{ company.name }}{% endblock %}
{% block content %}

<section class="hero">
  <div class="container hero-inner">
    <span class="eyebrow">TRACK YOUR SHIPMENT</span>
    <h1>Where's My <span>Box?</span></h1>
    <p class="lead">Enter your reference number below to see the latest status of your door-to-door box.</p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:720px;">
    <div class="quick-track" style="padding:20px;">
      <iframe
        src="https://rpxpress.ca/pack.html"
        width="100%"
        height="380"
        style="border: 1px solid var(--border); border-radius: 10px; display:block;"
        title="Track Your Package">
      </iframe>
    </div>
  </div>
</section>

{% endblock %}
