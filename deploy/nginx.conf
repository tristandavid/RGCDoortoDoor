# Copy to /etc/nginx/sites-available/rgc, symlink into sites-enabled, then
# run `sudo certbot --nginx -d rgcdoortodoorboxservices.ca -d www.rgcdoortodoorboxservices.ca`
# — certbot will edit this file in place to add the HTTPS server block and
# the HTTP->HTTPS redirect, so start with plain HTTP here.

server {
    listen 80;
    listen [::]:80;
    server_name rgcdoortodoorboxservices.ca www.rgcdoortodoorboxservices.ca;

    client_max_body_size 6M;  # a little above the app's 5 MB upload cap

    # Serve uploaded/static files directly — faster than round-tripping
    # through Gunicorn for something that never changes per-request.
    location /static/ {
        alias /opt/rgcdoortodoor/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
